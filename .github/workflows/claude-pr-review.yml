# Claude AI Code Review for Pull Requests
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude Code Review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.md
            **/*.py
            **/*.sh
            **/*.yml
            **/*.yaml
            **/*.toml
            **/*.html
            **/*.css
            **/*.js

      - name: Claude Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: anthropics/anthropic-quickstarts@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-5-20250929
          review-prompt: |
            Review the following code changes for:
            1. Code quality and best practices
            2. Security vulnerabilities
            3. Performance issues
            4. Documentation completeness
            5. For blog posts (markdown): readability, grammar, and structure
            6. For Hugo templates: proper template syntax and accessibility

            Provide constructive feedback and suggestions for improvement.
            Focus on significant issues rather than nitpicking.
