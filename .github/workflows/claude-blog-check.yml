# Claude AI Blog Post Quality Check
name: Claude Blog Quality Check

on:
  pull_request:
    paths:
      - 'content/posts/**/*.md'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  blog-quality-check:
    runs-on: ubuntu-latest
    name: Check Blog Post Quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            content/posts/**/*.md

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          pip install anthropic

      - name: Claude Blog Post Analysis
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          import anthropic
          import json

          client = anthropic.Anthropic(api_key=os.environ.get("ANTHROPIC_API_KEY"))

          # Get changed files from environment
          changed_files = """${{ steps.changed-files.outputs.all_changed_files }}"""

          for file_path in changed_files.split():
              if not file_path.endswith('.md'):
                  continue

              try:
                  with open(file_path, 'r') as f:
                      content = f.read()

                  message = client.messages.create(
                      model="claude-sonnet-4-5-20250929",
                      max_tokens=2048,
                      messages=[
                          {
                              "role": "user",
                              "content": f"""Analyze this blog post for quality and provide feedback:

          File: {file_path}

          {content}

          Please review for:
          1. Grammar and spelling
          2. Readability and clarity
          3. Structure and organization
          4. Front matter correctness (YAML)
          5. Markdown syntax issues
          6. SEO optimization (meta description, title)
          7. Content coherence and flow

          Provide constructive feedback in a friendly, helpful tone.
          If everything looks good, say so!
          """
                          }
                      ]
                  )

                  print(f"\n{'='*60}")
                  print(f"Analysis for: {file_path}")
                  print(f"{'='*60}")
                  print(message.content[0].text)

              except Exception as e:
                  print(f"Error analyzing {file_path}: {e}")

          EOF

      - name: Comment on PR
        if: steps.changed-files.outputs.any_changed == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Claude has analyzed your blog post changes. Check the workflow logs for detailed feedback!'
            })
