# Claude AI Security Scan
name: Claude Security Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Claude Security Analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic pyyaml

      - name: Claude Security Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import anthropic
          import glob

          client = anthropic.Anthropic(api_key=os.environ.get("ANTHROPIC_API_KEY"))

          # File patterns to scan
          patterns = [
              '**/*.py',
              '**/*.sh',
              '**/*.yml',
              '**/*.yaml',
              '**/hugo.toml'
          ]

          security_issues = []

          for pattern in patterns:
              files = glob.glob(pattern, recursive=True)
              for file_path in files:
                  # Skip vendor/node_modules directories
                  if 'vendor' in file_path or 'node_modules' in file_path:
                      continue

                  try:
                      with open(file_path, 'r') as f:
                          content = f.read()

                      # Skip empty or very large files
                      if not content or len(content) > 50000:
                          continue

                      message = client.messages.create(
                          model="claude-sonnet-4-5-20250929",
                          max_tokens=1024,
                          messages=[
                              {
                                  "role": "user",
                                  "content": f"""Perform a security analysis on this file:

          File: {file_path}

          {content}

          Check for:
          1. Hardcoded credentials or API keys
          2. SQL injection vulnerabilities
          3. Command injection risks
          4. Path traversal issues
          5. Insecure dependencies or configurations
          6. Exposed sensitive information
          7. YAML/configuration security issues

          Only report actual security issues or concerns.
          If the file is secure, respond with "SECURE".
          """
                              }
                          ]
                      )

                      response = message.content[0].text.strip()
                      if response != "SECURE":
                          security_issues.append({
                              'file': file_path,
                              'findings': response
                          })
                          print(f"\n⚠️  Security concerns in {file_path}:")
                          print(response)

                  except Exception as e:
                      print(f"Error scanning {file_path}: {e}")

          if security_issues:
              print(f"\n{'='*60}")
              print(f"Found {len(security_issues)} file(s) with potential security issues")
              print(f"{'='*60}")
              exit(1)
          else:
              print("\n✅ No security issues detected!")

          EOF

      - name: Create issue if security problems found
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security Scan Alert - ' + new Date().toISOString().split('T')[0],
              body: 'Claude Security Scan detected potential security issues. Please check the workflow logs for details.\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['security', 'automated']
            })
